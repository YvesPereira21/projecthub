<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}ProjectHub{% endblock %}</title>

    <!-- Google Fonts: Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- DaisyUI and Tailwind CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- CSS Global -->
    <link rel="stylesheet" href="/static/css/style.css?v=16">

	<!-- Importa a biblioteca Marked.js via CDN -->
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    {% block head %}{% endblock %}
</head>
<body class="text-slate-100">
    <aside class="side-bar">
		<section class="sidebar-header">
			<div class="brand-logo">
				<h1 class="text-[1.35rem] text-slate-100 font-bold tracking-tight">
					ProjectHub
				</h1>
			</div>

			<nav class="sidebar-nav">
				<div class="active text-slate-400 hover:text-slate-200 transition-colors" data-view="projects">
					<i class="fa-solid fa-folder-open"></i>
					<span>Projetos</span>
				</div>
				<div class="text-slate-400 hover:text-slate-200 transition-colors" data-view="dashboard">
					<i class="fa-solid fa-chart-line"></i>
					<span>Dashboard</span>
				</div>
			</nav>
		</section>

		<section>
			<form class="search-form">
				<label for="input-search" class="text-slate-400 cursor-pointer">
					<i class="fa-solid fa-magnifying-glass text-sm"></i>
				</label>
				<input id="input-search" type="text" placeholder="Buscar projetos"
					class="text-slate-100 placeholder-slate-400 text-sm">
			</form>
		</section>

		{% include "partials/project-list.html" %}
	</aside>

    <main class="main-viewport"> 
		{% block content %}
			{% include "partials/project-details.html" %}
		{% endblock %}
	</main>
		<!-- FLOATING TERMINAL -->
		<button onclick="toggleTerminal()" title="Abrir Terminal"
			class="fab-terminal fixed bottom-[24px] right-[24px] w-[48px] h-[48px] rounded-full border text-slate-100 flex items-center justify-center text-[20px] cursor-pointer shadow-lg transition-all duration-200 hover:scale-105 z-[90]">
			<i class="fa-solid fa-terminal"></i>
		</button>

		<div id="terminalOverlay"
			class="floating-terminal fixed bottom-[24px] right-[24px] w-[500px] h-[300px] rounded-[12px] backdrop-blur-xl border border-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.5),inset_0_0_0_1px_rgba(255,255,255,0.05)] flex flex-col translate-y-[120%] opacity-0 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] z-[100]">
			
			<div class="px-[16px] py-[12px] border-b border-white/5 flex justify-between items-center bg-black/20 rounded-t-[12px]">
				<span class="font-mono text-[12px] text-slate-400 flex items-center gap-[8px]">
					<i class="fa-solid fa-terminal text-cyan-500"></i> Local Console
				</span>
				<div class="flex gap-[12px]">
					<button onclick="clearLogs()" class="bg-transparent border-none text-slate-400 cursor-pointer text-[16px] hover:text-slate-100 transition-colors">
						<i class="fa-solid fa-trash"></i>
					</button>
					<button onclick="toggleTerminal()" class="bg-transparent border-none text-slate-400 cursor-pointer text-[16px] hover:text-slate-100 transition-colors">
						<i class="fa-solid fa-xmark"></i>
					</button>
				</div>
			</div>
			
			<div id="terminalLogs" class="flex-1 p-[16px] overflow-y-auto font-mono text-[12px] leading-relaxed text-slate-300">
				<div class="mb-[6px] text-cyan-400">[SISTEMA] FastAPI ProjectHub conectado.</div>
			</div>
		</div>

    <script src="/static/js/main.js?v=9"></script>
</body>
</html>
