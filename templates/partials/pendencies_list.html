{% for pendency in pendencies %}
<div class="tech-item">
    <div class="flex items-center gap-2.5 overflow-hidden">
        <i class="fa-regular fa-square-check text-amber-400 text-sm flex-shrink-0"></i>
        <span class="text-slate-200 text-sm truncate" title="{{ pendency.name }}">{{ pendency.name }}</span>
    </div>
    <span class="text-[10px] font-bold rounded-xl px-2 py-[2px] text-cyan-400 bg-cyan-500/15 border border-cyan-500/30 flex-shrink-0 ml-3">
        {{ pendency.project_name }}
    </span>
</div>
{% endfor %}
